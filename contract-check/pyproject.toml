[project]
name = "contract-check"
version = "0.1.0"
description = "Checks a Library service against the published API and runtime contract."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "jsonschema>=4.26,<5",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
contract-check = "contract_check.cli:main"

[dependency-groups]
dev = ["pytest>=9.2,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contract_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
